name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare manual tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          case "$tag" in
            v*) ;;
            *) echo "tag must start with v, for example v0.1.0" >&2; exit 1 ;;
          esac
          git fetch --force --tags
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git checkout -f "$tag"
          else
            git tag "$tag"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: src/go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify release
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l *.go)"
          go test -race ./...
          go vet ./...
          node --check public/assets/js/api.js
          node --check public/assets/js/app.js
          node --check ../test/frontend-contract.mjs
          node ../test/frontend-contract.mjs
          (
            cd ../test/seed
            test -z "$(gofmt -l *.go)"
            go test -race ./...
            go vet ./...
          )
          docker compose -f ../test/docker-compose.yaml config --quiet

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "v2.17.0"
          args: release --clean
          workdir: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
