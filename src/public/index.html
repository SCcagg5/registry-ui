<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registry UI</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/ui.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="container head">
        <h1>Registry UI</h1>
        <span id="versionBadge" class="version">dev</span>
      </div>
    </header>

    <main class="container main">
      <section class="panel toolbar" aria-label="Main actions">
        <div class="toolbar-title">
          <button id="backBtn" class="btn ghost back-btn is-placeholder" type="button" title="Back" aria-label="Back" disabled>←</button>
          <h2 id="viewTitle">Repositories</h2>
        </div>
        <div class="toolbar-actions">
          <label class="field">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Image or namespace" />
          </label>
        </div>
      </section>

      <section id="notice" class="notice hidden"></section>
      <section id="content" class="panel content" aria-live="polite"></section>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <noscript>
    <main class="container main">
      <section class="panel content empty">
        JavaScript is required to browse this registry.
      </section>
    </main>
  </noscript>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
